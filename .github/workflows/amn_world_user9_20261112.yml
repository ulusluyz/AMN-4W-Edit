name: Ask 9 new user questions to frozen world-knowledge AMN
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amn_world_user9_20261112.yml'
permissions:
  contents: write
concurrency:
  group: amn-world-user9-20261112
  cancel-in-progress: false
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt
      - name: Ask exact user questions without retraining
        run: python -u experiments/ask_world_9_user_20261112.py
      - name: Save all unedited outputs to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp results/amn_world_v1_train/user_questions_20261112/* "$tmp/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/amn_world_v1_train/user_questions_20261112
            cp "$tmp/"* results/amn_world_v1_train/user_questions_20261112/
            git add -f results/amn_world_v1_train/user_questions_20261112/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Archive nine actual new user answers from frozen world-knowledge AMN"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
