name: AMN-TM v3 five-stage Turkish training (16M pilot)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amn_tm_v3_train.yml'

permissions:
  contents: write

concurrency:
  group: amn-tm-v3-native-pilot
  cancel-in-progress: false

jobs:
  pilot-train:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU software dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify 16M AMN math, causal inference, losses and checkpoint
        run: python -m pytest -q tests/test_amn_tm_v3.py
      - name: Fetch original licensed Turkish Alpaca text and isolate train/dev/test
        run: |
          python -u experiments/prepare_open_turkish.py \
            --output data/open_turkish_v3 \
            --max-samples 20000 --max-seq-len 680 \
            --min-answer-bytes 45 --min-train 3000
      - name: Train AMN-TM v3 from scratch on five objectives within CPU pilot budget
        run: |
          python -u experiments/train_amn_tm_v3.py \
            --data data/open_turkish_v3 \
            --output results/amn_tm_v3_pilot \
            --width 544 --layers 6 --key-dim 128 --semantic-dim 192 \
            --vocab 8192 --max-len 144 --semantic-len 56 \
            --batch 2 --threads 2 --seed 73 --lr 0.0008 \
            --lm-steps 28 --intent-steps 16 \
            --ground-steps 16 --dialogue-steps 16 --sft-steps 64 \
            --eval-every 16 --eval-rows 24 --test-rows 40 \
            --generate-tokens 112 --max-seconds 2500
      - name: Save independent pilot model, tokenizer, metrics and unedited Turkish answers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp -a results/amn_tm_v3_pilot/. "$tmp/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/amn_tm_v3_pilot
            cp -a "$tmp/." results/amn_tm_v3_pilot/
            git add -f results/amn_tm_v3_pilot/
            if git diff --cached --quiet; then
              echo "Exact artifacts already archived"
              exit 0
            fi
            git commit -m "Archive AMN-TM v3 five-stage Turkish CPU pilot checkpoint and genuine samples"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent push; retrying latest main"
          done
          exit 1
