name: Native AMN subword Turkish text training

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amn_open_turkish_sp.yml'
      - 'experiments/amn_open_turkish_sp.py'
      - 'experiments/train_open_turkish_sp.py'
      - 'tests/test_amn_open_turkish_sp.py'

permissions:
  contents: write

concurrency:
  group: amn-open-turkish-subword-research
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU model stack
        run: |
          python -m pip install -r requirements.txt
          python -m pip install sentencepiece==0.2.1
      - name: Unit test sentencepiece, streaming AMN, causality and checkpoint
        run: python -m pytest -q tests/test_amn_open_turkish_sp.py
      - name: Download identical public Turkish data (train-only tokenizer)
        run: |
          python -u experiments/prepare_open_turkish.py \
            --output data/open_turkish \
            --max-samples 12000 --max-seq-len 320 \
            --min-answer-bytes 50 --min-train 1500
      - name: Train native AMN with learned subword vocabulary
        run: |
          python -u experiments/train_open_turkish_sp.py \
            --data data/open_turkish --output results/open_turkish_sp \
            --steps 1800 --width 160 --key-dim 32 --layers 2 \
            --vocab-size 2500 --max-len 192 --batch 16 \
            --lr 0.0018 --threads 2 --eval-every 150
      - name: Keep original models untouched, archive independent artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp -a results/open_turkish_sp/. "$tmp/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/open_turkish_sp
            cp -a "$tmp/." results/open_turkish_sp/
            git add -f results/open_turkish_sp
            if git diff --cached --quiet; then
              echo 'Artifacts already identical'
              exit 0
            fi
            git commit -m "Archive native subword AMN Turkish checkpoint, tokenizer and raw model answers"
            if git push origin HEAD:main; then exit 0; fi
            echo 'Concurrent update; retry'
          done
          exit 1
