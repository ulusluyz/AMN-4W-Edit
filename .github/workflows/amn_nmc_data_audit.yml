name: AMN-NMC Turkish corpus audit (no training)
on:
  push:
    branches: [feature/amn-nmc]
    paths:
      - 'src/amn_nmc/data_audit.py'
      - 'src/amn_nmc/wiki_sample_audit.py'
      - 'tests/test_nmc_data_audit.py'
      - '.github/workflows/amn_nmc_data_audit.yml'
  workflow_dispatch:
jobs:
  audit-real-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Verify audit logic
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_nmc_data_audit.py
      - name: Audit existing Wikipedia source text
        env:
          PYTHONPATH: src
        run: |
          python -m amn_nmc.data_audit --input data/amn_world_v1/accepted_pages.jsonl --output work/quality_existing --license CC-BY-SA-4.0
      - name: Audit old QA as unsuitable raw LM data
        env:
          PYTHONPATH: src
        run: |
          python -m amn_nmc.data_audit --input data/amn_world_v1/train.jsonl --output work/quality_qa --license CC-BY-SA-4.0
      - name: Audit real untruncated public Wikipedia records
        id: external
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m amn_nmc.wiki_sample_audit --output work/quality_external_wikipedia --per-offset 24
      - name: Record limitations
        if: always()
        run: |
          echo "No dataset is approved for training by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "External sample download errors do not imply that a dataset passed audit." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit reports, not trained models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmc-corpus-quality-audit
          path: |
            work/quality_existing/audit.json
            work/quality_qa/audit.json
            work/quality_external_wikipedia/provenance.json
            work/quality_external_wikipedia/quality/audit.json
            work/quality_external_wikipedia/quality/rejected_or_review.jsonl
          if-no-files-found: warn
