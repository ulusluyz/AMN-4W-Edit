name: Train AMN v3.1 general Turkish world knowledge on audited Wikipedia TUIK sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amn_world_train.yml'

permissions:
  contents: write

concurrency:
  group: amn-world-v1-train
  cancel-in-progress: false

jobs:
  world-train:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU training environment
        run: python -m pip install -r requirements.txt
      - name: Verify manually reviewed data quality, model architecture and epoch sampler
        run: |
          python -m pytest -q \
            tests/test_amn_world_facts_v1.py \
            tests/test_amn_world_training_v1.py \
            tests/test_amn_epoch_sampler.py \
            tests/test_amn_tm_v31.py
      - name: Verify actual source SHA and train on fully audited real Turkish encyclopedia facts
        run: |
          python -u experiments/train_amn_world_v1.py \
            --data data/amn_world_v1 \
            --base results/amn_tm_v31/best.pt \
            --tokenizer results/amn_tm_v31/tokenizer.model \
            --output results/amn_world_v1_train \
            --max-length 192 --epochs 2 \
            --max-steps 900 --max-seconds 2400 \
            --lr 0.00025 --general-batch 2 --core-batch 2 \
            --threads 2 --eval-rows 48 --test-rows 54 \
            --eval-every 120 --log-every 80 --seed 131
      - name: Archive trained native AMN weights, full provenance metrics and unmodified Turkish answers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp -a results/amn_world_v1_train/. "$tmp/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/amn_world_v1_train
            cp -a "$tmp/." results/amn_world_v1_train/
            git add -f results/amn_world_v1_train/
            if git diff --cached --quiet; then
              echo "Result already archived"
              exit 0
            fi
            git commit -m "Archive world-knowledge trained AMN v3.1 with heldout evaluation and raw direct answers"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update: refresh and retry"
          done
          exit 1
