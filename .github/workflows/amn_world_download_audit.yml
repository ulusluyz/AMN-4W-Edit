name: Download and audit clean Turkish world knowledge (Wikipedia + TUIK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amn_world_download_audit.yml'

permissions:
  contents: write

concurrency:
  group: amn-world-v1-data-ingestion
  cancel-in-progress: false

jobs:
  fetch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tightened topic-lead matching, source attribution and official name counts
        run: python -m pip install pytest && python -m pytest -q tests/test_amn_world_facts_v1.py
      - name: Download 355 intentionally selected general-knowledge Turkish Wikipedia articles
        run: |
          python -u experiments/prepare_amn_world_facts_v1.py \
            --seeds data/amn_world_seed_topics_v1.json \
            --output data/amn_world_v1 \
            --workers 5 --min-accepted 90
      - name: Archive download, rejected articles, source attribution, audit samples and clean QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp -a data/amn_world_v1/. "$tmp/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/amn_world_v1
            cp -a "$tmp/." data/amn_world_v1/
            git add -f data/amn_world_v1/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Archive source-attributed Wikipedia world knowledge and quality-gated Turkish QAs"
            if git push origin HEAD:main; then exit 0; fi
            echo "Retry after concurrent update"
          done
          exit 1
