name: Verify three frozen models with Turkish text output

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify_three_models_turkish.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical environment
        run: |
          python -m pip install -r requirements.txt
      - name: Validate all three saved model families and render actual Turkish examples
        run: |
          python experiments/validate_three_models_turkish.py
      - name: Archive model-generated evidence on Edit branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/real_turkish_3models/validation.json results/real_turkish_3models/outputs_tr.md
          git commit -m "Archive three-model heldout and Turkish response evidence"
          git push origin HEAD:main
