name: AMN-NMC CPU verification
on:
  push:
    branches: [feature/amn-nmc]
    paths:
      - 'src/amn_nmc/**'
      - 'tests/test_nmc.py'
      - 'configs/nmc/**'
      - '.github/workflows/amn_nmc_cpu.yml'
  pull_request:
    paths:
      - 'src/amn_nmc/**'
      - 'tests/test_nmc.py'
      - 'configs/nmc/**'
      - '.github/workflows/amn_nmc_cpu.yml'
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Check neural CPU functionality
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '2'
        run: python -m pytest -q tests/test_nmc.py
