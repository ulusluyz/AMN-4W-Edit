name: AMN-NMC CPU verification
on:
  push:
    branches: [feature/amn-nmc]
    paths:
      - 'src/amn_nmc/**'
      - 'tests/test_nmc.py'
      - 'tests/test_nmc_pdf_source.py'
      - 'tests/test_nmc_training_v2.py'
      - 'tests/test_nmc_capability.py'
      - 'tests/test_nmc_fullpass_continual.py'
      - 'configs/nmc/**'
      - '.github/workflows/amn_nmc_cpu.yml'
  pull_request:
    paths:
      - 'src/amn_nmc/**'
      - 'tests/test_nmc.py'
      - 'tests/test_nmc_pdf_source.py'
      - 'tests/test_nmc_training_v2.py'
      - 'tests/test_nmc_capability.py'
      - 'tests/test_nmc_fullpass_continual.py'
      - 'configs/nmc/**'
      - '.github/workflows/amn_nmc_cpu.yml'
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and PDF tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pymupdf
      - name: Verify neural model and PDF source lock (synthetic PDF only)
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '2'
        run: python -m pytest -q tests/test_nmc.py tests/test_nmc_pdf_source.py tests/test_nmc_training_v2.py tests/test_nmc_capability.py tests/test_nmc_fullpass_continual.py
      - name: Preserve tested source for identical offline CPU smoke test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amn-nmc-verified-source
          path: |
            src/amn_nmc/
            configs/nmc/cpu_smoke.json
          if-no-files-found: error
